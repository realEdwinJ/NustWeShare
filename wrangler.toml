name = "nustweshare"
main = ".open-next/worker.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Generated by OpenNext — `npm run build` (opennextjs-cloudflare build) creates .open-next/worker.js
# For local dev without Workers, `npm run dev` still works via Next.js (webpack)

[vars]
NEXT_PUBLIC_APP_URL = "https://nustweshare.workers.dev"

# R2 bucket for PDFs — native Worker binding (Spec 16, no S3 credentials in Worker)
# Bound as PAPERS_BUCKET in Worker runtime via env.PAPERS_BUCKET (R2Bucket)
# Wrangler will use bucket_name, preview uses same bucket for dev
[[r2_buckets]]
binding = "PAPERS_BUCKET"
bucket_name = "nustweshare-papers"
preview_bucket_name = "nustweshare-papers-preview"

# Environment for preview — re-uses same binding name for consistency
[env.preview.vars]
NEXT_PUBLIC_APP_URL = "https://preview.nustweshare.workers.dev"

[[env.preview.r2_buckets]]
binding = "PAPERS_BUCKET"
bucket_name = "nustweshare-papers-preview"
preview_bucket_name = "nustweshare-papers-preview"

# Observability — lightweight logs via Cloudflare (Spec 77)
[observability]
enabled = true
head_sampling_rate = 1

# Secrets — set via: wrangler secret put DATABASE_URL etc.
# DATABASE_URL (Postgres, Neon/Supabase free tier)
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (if using S3-compatible outside Workers binding)
# APP_SECRET (64-char random, for session signing)
# ADMIN_SECRET (32-char random, for POST /api/admin/papers/[id]/restore)

# To deploy:
#   npm run build          # via OpenNext: opennextjs-cloudflare build
#   wrangler deploy
# Or via GitHub Actions on push to main (see .github/workflows/deploy.yml)
